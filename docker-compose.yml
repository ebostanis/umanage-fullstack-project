services:
  mysql:
    image: mysql:8.0
    container_name: mysqldb
    restart: always
    volumes:
      - mysql_data:/var/lib/mysql

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: usersapp
      MYSQL_USER: user
      MYSQL_PASSWORD: user

    ports:
      - "3308:3306"
    networks:
      - app-network

  backend:
    build: ./usersapp
    container_name: backend
    depends_on:
      - mysql
    ports:
      - "8080:8080"
    environment:
      MYSQL_HOST: mysql
      MYSQL_USER: user
      MYSQL_PASSWORD: user
      MYSQL_PORT: 3306
    networks:
      - app-network

  frontend:
    build: ./usersapp-front
    container_name: frontend
    depends_on:
      - backend
    ports:
      - "3000:3000"
    working_dir: /app
    command: [ "npx", "serve", "-s", "build", "-l", "3000" ]
    environment:
      - REACT_APP_API_URL=http://backend:8080
    networks:
      - app-network

volumes:
  mysql_data:


networks:
  app-network:
